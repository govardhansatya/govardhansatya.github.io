<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Virtual Mouse Controller</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 20px;
            background-color: #f4f4f4;
        }
        .container {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.2);
            max-width: 500px;
            margin: auto;
        }
        h2 {
            color: #333;
        }
        button {
            padding: 10px 20px;
            margin: 10px;
            border: none;
            cursor: pointer;
            font-size: 16px;
            border-radius: 5px;
        }
        .start {
            background-color: #4CAF50;
            color: white;
        }
        .stop {
            background-color: #f44336;
            color: white;
        }
        .disabled {
            background-color: grey;
            cursor: not-allowed;
        }
        #status {
            margin-top: 15px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Virtual Mouse Controller</h2>
        <button id="startBtn" class="start" onclick="startMouse()">Start Virtual Mouse</button>
        <button id="stopBtn" class="stop disabled" onclick="stopMouse()" disabled>Stop Virtual Mouse</button>
        <p id="status">Status: <span style="color: grey;">Idle</span></p>
    </div>

    <script>
        const startBtn = document.getElementById("startBtn");
        const stopBtn = document.getElementById("stopBtn");
        const statusText = document.getElementById("status");

        async function startMouse() {
            try {
                let response = await fetch("/start", { method: "POST" });
                let data = await response.json();
                if (data.success) {
                    statusText.innerHTML = "Status: <span style='color: green;'>Running</span>";
                    startBtn.classList.add("disabled");
                    startBtn.disabled = true;
                    stopBtn.classList.remove("disabled");
                    stopBtn.disabled = false;
                }
            } catch (error) {
                statusText.innerHTML = "Status: <span style='color: red;'>Error</span>";
            }
        }

        async function stopMouse() {
            try {
                let response = await fetch("/stop", { method: "POST" });
                let data = await response.json();
                if (data.success) {
                    statusText.innerHTML = "Status: <span style='color: grey;'>Stopped</span>";
                    startBtn.classList.remove("disabled");
                    startBtn.disabled = false;
                    stopBtn.classList.add("disabled");
                    stopBtn.disabled = true;
                }
            } catch (error) {
                statusText.innerHTML = "Status: <span style='color: red;'>Error</span>";
            }
        }
    </script>

</body>
</html>
